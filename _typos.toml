# typos spell checker: US English (locale en-us).
[default]
locale = "en-us"
# GitHub API spellings (conclusion strings, cancelled()) and the official name
# of the EUPL, which keep their spelling.
extend-ignore-re = [
  "['\"`]cancelled['\"`]",
  "['\"`]CANCELLED['\"`]",
  "cancelled\\(\\)",
  "European Union Public Licence",
]

[files]
extend-exclude = [
  "LICENSE",
  "COPYING*",
  "**/licenses/**",
  "*.patch",
  "*.lock",
  "go.sum",
]

[default.extend-words]
# Tokens, escapes and test inputs that are not misspellings.
bre = "bre"
caf = "caf"
mis = "mis"
ordr = "ordr"
ot = "ot"
pn = "pn"
wdth = "wdth"
# British forms that typos with en-us does not flag on its own.
catalogue = "catalog"
catalogues = "catalogs"
catalogued = "cataloged"
cataloguing = "cataloging"
cancelled = "canceled"
cancelling = "canceling"
misspelt = "misspelled"
