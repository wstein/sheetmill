# SPDX-License-Identifier: EUPL-1.2
# Compile-only guard for every push. Releases are built, smoke-tested and published by
# release.yml (specs/019-release-workflow); the build matrix below must match its targets.
name: check
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          check-latest: false
      - run: make fmt-check
      - run: make mod-verify
      - run: make race
      - run: make vet
      - run: make test-assets
      - name: Install pinned Hugo development tool
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .hugo-version)" = 0.167.0
          mkdir -p "$RUNNER_TEMP/sheetmill-hugo"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sheetmill-hugo/hugo.tar.gz" https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_0.167.0_linux-amd64.tar.gz
          echo '4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169  '"$RUNNER_TEMP/sheetmill-hugo/hugo.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sheetmill-hugo/hugo.tar.gz" -C "$RUNNER_TEMP/sheetmill-hugo" hugo
      - name: Verify actual local Hugo output
        run: SHEETMILL_HUGO="$RUNNER_TEMP/sheetmill-hugo/hugo" make test-hugo
      - name: Verify actual Hugo Studio lifecycle and boundaries
        run: SHEETMILL_HUGO="$RUNNER_TEMP/sheetmill-hugo/hugo" make test-studio
      - run: make fuzz
      - run: make verify-clean

  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          check-latest: false
          # Own cache would be saved first and displace the core job's cache.
          cache: false
      - name: Build smill binary (${{ matrix.os }}/${{ matrix.arch }})
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags "-X github.com/wstein/sheetmill/internal/cli.Version=v0.0.0-ci" -o /dev/null ./cmd/smill
