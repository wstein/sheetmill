# SPDX-License-Identifier: EUPL-1.2
name: check
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          check-latest: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test ./internal/frontmatter -run '^$' -fuzz FuzzParse -fuzztime 5s -parallel 2
      - run: go test ./internal/markdown -run '^$' -fuzz FuzzParse -fuzztime 5s -parallel 2
      - run: go test ./internal/importer/reference -run '^$' -fuzz FuzzConvert -fuzztime 5s -parallel 2
      - run: git diff --exit-code && git diff --check
