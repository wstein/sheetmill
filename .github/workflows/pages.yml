# SPDX-License-Identifier: EUPL-1.2
# Authorized 2026-10-13 (AGENTS.md, specs/012): publish the manual built from docs/
# at https://wstein.github.io/sheetmill/ and the independently authored
# examples/sheets demo library. The demo is published three times, one static site
# per layout, at /sheetmill/demo/ (editorial), /sheetmill/demo-compact/ and
# /sheetmill/demo-cards/ (paths confirmed by the user on 2026-10-16, specs/018).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          check-latest: false
      # Deploy only a revision that passes the core checks.
      - run: test -z "$(gofmt -l cmd internal assets)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - name: Install pinned Hugo
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .hugo-version)" = 0.167.0
          mkdir -p "$RUNNER_TEMP/sheetmill-hugo"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sheetmill-hugo/hugo.tar.gz" https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_0.167.0_linux-amd64.tar.gz
          echo '4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169  '"$RUNNER_TEMP/sheetmill-hugo/hugo.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sheetmill-hugo/hugo.tar.gz" -C "$RUNNER_TEMP/sheetmill-hugo" hugo
      - name: Export and build the manual and the three demo layouts
        shell: bash
        run: |
          set -euo pipefail
          hugo() { HUGO_CACHEDIR="$RUNNER_TEMP/hugo-cache" "$RUNNER_TEMP/sheetmill-hugo/hugo" --source "$1" --destination "$2" --clock 2000-01-01T00:00:00Z --noBuildLock --quiet; }
          mapfile -t pages < <(grep -v -e '^#' -e '^$' docs/manual-pages.txt)
          go run ./cmd/smill build hugo "${pages[@]}" --out "$RUNNER_TEMP/manual" --header-link 'Example library=/sheetmill/demo/' --title 'SheetMill Manual' --description 'How to write, check and publish reference sheets with SheetMill.' --base-path /sheetmill/ --site-url https://wstein.github.io/sheetmill/ --source-base-url https://github.com/wstein/sheetmill/blob/main/docs/ --edit-base-url https://github.com/wstein/sheetmill/edit/main/docs/
          demo_description='Example reference sheets, independently authored and compiled with SheetMill.'
          demo_edit=https://github.com/wstein/sheetmill/edit/main/examples/sheets/
          go run ./cmd/smill build hugo examples/sheets --out "$RUNNER_TEMP/demo" --title 'SheetMill Demo' --description "$demo_description" --base-path /sheetmill/demo/ --site-url https://wstein.github.io/sheetmill/demo/ --edit-base-url "$demo_edit" --header-link 'Compact layout=/sheetmill/demo-compact/' --header-link 'Cards layout=/sheetmill/demo-cards/'
          go run ./cmd/smill build hugo examples/sheets --out "$RUNNER_TEMP/demo-compact" --theme classic-compact --title 'SheetMill Demo (compact layout)' --description "$demo_description" --base-path /sheetmill/demo-compact/ --site-url https://wstein.github.io/sheetmill/demo-compact/ --edit-base-url "$demo_edit" --header-link 'Editorial layout=/sheetmill/demo/' --header-link 'Cards layout=/sheetmill/demo-cards/'
          go run ./cmd/smill build hugo examples/sheets --out "$RUNNER_TEMP/demo-cards" --theme reference-cards --title 'SheetMill Demo (cards layout)' --description "$demo_description" --base-path /sheetmill/demo-cards/ --site-url https://wstein.github.io/sheetmill/demo-cards/ --edit-base-url "$demo_edit" --header-link 'Editorial layout=/sheetmill/demo/' --header-link 'Compact layout=/sheetmill/demo-compact/'
          hugo "$RUNNER_TEMP/manual" "$RUNNER_TEMP/public"
          # The demos are mounted below the manual; refuse to merge over a manual page.
          test ! -e "$RUNNER_TEMP/public/demo"
          hugo "$RUNNER_TEMP/demo" "$RUNNER_TEMP/public/demo"
          test ! -e "$RUNNER_TEMP/public/demo-compact"
          hugo "$RUNNER_TEMP/demo-compact" "$RUNNER_TEMP/public/demo-compact"
          test ! -e "$RUNNER_TEMP/public/demo-cards"
          hugo "$RUNNER_TEMP/demo-cards" "$RUNNER_TEMP/public/demo-cards"
          # Plain-text resources for AI agents, linked from smill --help.
          test ! -e "$RUNNER_TEMP/public/llms.txt" && test ! -e "$RUNNER_TEMP/public/agent-guide.md"
          cp llms.txt "$RUNNER_TEMP/public/llms.txt"
          cp docs/agent-guide.md "$RUNNER_TEMP/public/agent-guide.md"
      - name: Verify the Pages tree
        run: sh .github/scripts/verify-pages.sh "$RUNNER_TEMP/public"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/public
  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
